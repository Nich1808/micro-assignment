
server:
  port: ${PAYMENT_PORT:1811}

spring:
  application:
    name: payment-service
  mongodb:
    uri: ${PAYMENT_MONGO_URI:mongodb://mongod:mongod@localhost:2027/istad_payment?authSource=admin}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
