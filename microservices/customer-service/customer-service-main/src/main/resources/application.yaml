server:
  port: ${CUSTOMER_PORT:1809}

spring:
  application:
    name: customer-service
  mongodb:
    uri: mongodb://mongod:mongod@localhost:2027/istad_customer?authSource=admin
    uuid-representation: standard

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
